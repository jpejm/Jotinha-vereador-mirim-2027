<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>João Pedro — Vereador Mirim 2027 | Itapema-SC</title>
<meta name="description" content="Conheça João Pedro e suas propostas para o Vereador Mirim 2027 em Itapema-SC.">
<meta property="og:title" content="João Pedro — Vereador Mirim 2027 | Itapema-SC">
<meta property="og:description" content="Conheça João Pedro e suas propostas para o Vereador Mirim 2027 em Itapema-SC.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230c2218'/><text y='78' x='16' font-size='76' font-family='Georgia,serif' fill='%23eab308' font-weight='900'>J</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--g950:#021409;--g900:#0c2218;--g800:#133a27;--g700:#185c35;--g600:#1a7d42;--g500:#22a352;--g400:#34c868;--g300:#5dda87;--g100:#c3f0d4;--g50:#eefaf4;
--y600:#b58100;--y500:#d9a000;--y400:#eab308;--y300:#f5cc30;--y100:#fef3c7;
--w:#fff;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--s900:#0f172a;
--ff-head:'Montserrat',sans-serif;--ff-body:'Inter',sans-serif;
--r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:22px;--r-2xl:32px;
--sh-card:0 1px 4px rgba(0,0,0,.06),0 4px 20px rgba(0,0,0,.07);
--sh-float:0 8px 32px rgba(0,0,0,.14);
--t:.2s ease;--hh:66px;
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--ff-body);background:var(--s50);color:var(--s800);line-height:1.6;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:var(--ff-body)}
button{cursor:pointer}

/* HEADER */
.hd{position:fixed;top:0;left:0;right:0;z-index:90;height:var(--hh);background:rgba(12,34,24,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.hd-in{max-width:1240px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.hd-logo-j{width:34px;height:34px;background:var(--y400);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-head);font-weight:900;font-size:19px;color:var(--g900);flex-shrink:0}
.hd-logo-text{display:flex;flex-direction:column;line-height:1.15}
.hd-logo-name{font-family:var(--ff-head);font-weight:800;font-size:14px;color:var(--w);letter-spacing:.02em}
.hd-logo-sub{font-size:10.5px;color:var(--y400);font-weight:600;letter-spacing:.06em}
.hd-nav{display:flex;align-items:center;gap:2px}
.hd-link{font-size:13px;font-weight:500;color:rgba(255,255,255,.75);padding:6px 10px;border-radius:var(--r-sm);transition:color var(--t),background var(--t);white-space:nowrap;background:none;border:none;cursor:pointer}
.hd-link:hover{color:var(--w);background:rgba(255,255,255,.07)}
.hd-link.act{color:var(--y300)}
.hd-cta{background:var(--g600)!important;color:var(--w)!important;font-weight:700!important;padding:7px 14px!important;border-radius:var(--r-md)!important}
.hd-cta:hover{background:var(--g500)!important}
.hd-burger{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:8px;border-radius:6px}
.hd-burger span{display:block;width:21px;height:2px;background:var(--w);border-radius:2px;transition:all var(--t)}
.mob-nav{display:none;position:fixed;top:var(--hh);left:0;right:0;background:rgba(10,28,20,.97);backdrop-filter:blur(14px);z-index:89;padding:12px 20px 20px;flex-direction:column;gap:3px;border-bottom:1px solid rgba(255,255,255,.07)}
.mob-nav.open{display:flex}
.mob-link{font-size:15px;font-weight:500;color:rgba(255,255,255,.75);padding:11px 14px;border-radius:var(--r-md);background:none;border:none;cursor:pointer;text-align:left;width:100%;transition:background var(--t),color var(--t)}
.mob-link:hover{color:var(--w);background:rgba(255,255,255,.07)}
.mob-link.act{color:var(--y300)}

/* MAIN */
.main{padding-top:var(--hh);min-height:100vh}
.page{animation:pgIn .28s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:var(--r-md);font-family:var(--ff-head);font-weight:700;font-size:13.5px;letter-spacing:.03em;border:none;transition:all var(--t);cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--g600);color:var(--w)}
.btn-primary:hover{background:var(--g500);box-shadow:0 6px 20px rgba(22,125,66,.35)}
.btn-yellow{background:var(--y400);color:var(--g900)}
.btn-yellow:hover{background:var(--y300)}
.btn-outline{background:transparent;color:var(--w);border:2px solid rgba(255,255,255,.28)}
.btn-outline:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.06)}
.btn-ghost{background:transparent;color:var(--g600);border:2px solid var(--g600)}
.btn-ghost:hover{background:var(--g50)}
.btn-danger{background:#dc2626;color:var(--w)}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:8px 16px;font-size:12px}
.btn-lg{padding:15px 34px;font-size:15px}
.btn-full{width:100%}

/* HERO */
.hero{background:var(--g900);min-height:calc(100vh - var(--hh));display:flex;align-items:center;position:relative;overflow:hidden;padding:80px 0 70px}
.hero::before{content:'';position:absolute;top:-30%;right:-8%;width:600px;height:600px;background:radial-gradient(circle,rgba(52,200,104,.12) 0%,transparent 68%);border-radius:50%}
.hero-in{max-width:1240px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr 420px;gap:48px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.25);border-radius:100px;padding:5px 14px;font-size:11.5px;font-weight:700;color:var(--y400);letter-spacing:.07em;text-transform:uppercase;margin-bottom:22px}
.hero-dot{width:5px;height:5px;background:var(--y400);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hero-h1{font-family:var(--ff-head);font-size:clamp(44px,6vw,76px);font-weight:900;color:var(--w);line-height:.96;letter-spacing:-.02em;margin-bottom:10px}
.hero-h1 .green{color:var(--g400)}
.hero-sub{font-family:var(--ff-head);font-size:clamp(13px,1.6vw,17px);font-weight:600;color:var(--y400);letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
.hero-tagline{font-family:var(--ff-head);font-size:clamp(16px,2.1vw,22px);font-weight:800;color:var(--w);letter-spacing:.06em;margin-bottom:22px;opacity:.9}
.hero-desc{font-size:clamp(14.5px,1.3vw,17px);color:rgba(255,255,255,.68);line-height:1.75;margin-bottom:34px;max-width:490px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{display:flex;justify-content:center}
.hero-frame{position:relative;width:340px;height:420px}
.hero-frame-bg{position:absolute;inset:0;border-radius:var(--r-2xl);background:linear-gradient(145deg,rgba(52,200,104,.14),rgba(234,179,8,.1));border:1px solid rgba(52,200,104,.22)}
.hero-placeholder{position:absolute;inset:14px;border-radius:20px;border:2px dashed rgba(52,200,104,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.hero-placeholder-icon{font-size:44px;opacity:.35}
.hero-placeholder-text{font-size:12px;color:rgba(255,255,255,.28);line-height:1.6}
.hero-j{position:absolute;top:-18px;right:-18px;width:58px;height:58px;background:var(--y400);border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:var(--ff-head);font-weight:900;font-size:30px;color:var(--g900);transform:rotate(7deg);box-shadow:0 6px 22px rgba(234,179,8,.4)}
.hero-nick{position:absolute;bottom:-13px;left:20px;background:var(--g600);color:var(--w);padding:8px 18px;border-radius:100px;font-family:var(--ff-head);font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(22,125,66,.45)}

/* TICKER */
.ticker{overflow:hidden;background:var(--y400);padding:9px 0}
.ticker-inner{display:flex;white-space:nowrap;animation:tick 22s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{font-family:var(--ff-head);font-weight:800;font-size:12.5px;letter-spacing:.08em;color:var(--g900);padding:0 28px;display:inline-flex;align-items:center;gap:14px}
.ticker-item::after{content:'◆';font-size:7px;color:var(--g700)}

/* SECTIONS */
.sec{padding:80px 0}
.sec-alt{background:var(--w)}
.sec-dark{background:var(--g900)}
.sec-in{max-width:1240px;margin:0 auto;padding:0 24px}
.sec-in-narrow{max-width:760px;margin:0 auto;padding:0 24px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--g600);margin-bottom:10px;display:block}
.sec-title{font-family:var(--ff-head);font-size:clamp(26px,3.8vw,40px);font-weight:800;color:var(--s900);line-height:1.18;margin-bottom:14px}
.sec-sub{font-size:17px;color:var(--s500);line-height:1.68;max-width:540px}
.sec-dark .sec-label{color:var(--g400)}
.sec-dark .sec-title{color:var(--w)}
.sec-dark .sec-sub{color:rgba(255,255,255,.58)}

/* PROPOSAL CARDS */
.proposals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.p-card{background:var(--w);border:1px solid var(--s200);border-radius:var(--r-lg);padding:26px;transition:all var(--t);cursor:pointer;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.p-card:hover{border-color:rgba(26,125,66,.25);box-shadow:var(--sh-float);transform:translateY(-2px)}
.p-card-top{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g600),var(--g400));opacity:0;transition:opacity var(--t)}
.p-card:hover .p-card-top{opacity:1}
.p-card-num{position:absolute;bottom:14px;right:16px;font-family:var(--ff-head);font-size:52px;font-weight:900;color:rgba(0,0,0,.04);line-height:1;pointer-events:none;user-select:none}
.p-card-icon{font-size:28px;width:52px;height:52px;background:var(--g50);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.p-card-title{font-family:var(--ff-head);font-size:16.5px;font-weight:700;color:var(--s900);line-height:1.3}
.p-card-desc{font-size:13.5px;color:var(--s500);line-height:1.62;flex:1}
.p-card-link{font-size:13px;font-weight:600;color:var(--g600);display:flex;align-items:center;gap:5px;margin-top:4px}

/* PAGE HEADER */
.pg-hd{background:linear-gradient(135deg,var(--g900),var(--g800));padding:52px 0 44px}
.pg-hd .sec-label{color:var(--g400)}
.pg-hd .sec-title{color:var(--w)}
.pg-hd .sec-sub{color:rgba(255,255,255,.62)}

/* BREADCRUMB */
.bc{background:var(--w);border-bottom:1px solid var(--s100);padding:11px 0}
.bc-in{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--s400)}
.bc-btn{color:var(--g600);font-weight:600;background:none;border:none;cursor:pointer;font-size:13px;padding:0;font-family:var(--ff-body)}
.bc-sep{color:var(--s300)}

/* WHY CARDS */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.why-card{border:1px solid rgba(52,200,104,.18);border-radius:var(--r-lg);padding:32px 28px;background:rgba(52,200,104,.06)}
.why-card-word{font-family:var(--ff-head);font-size:26px;font-weight:900;color:var(--g400);letter-spacing:.04em;margin-bottom:10px}
.why-card-text{font-size:14px;color:rgba(255,255,255,.58);line-height:1.68}

/* ABOUT */
.about-layout{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about-quote{font-size:18px;font-style:italic;color:var(--s700);line-height:1.62;border-left:3px solid var(--g600);padding-left:20px;margin:24px 0}
.about-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.about-tag{background:var(--g50);border:1px solid rgba(26,125,66,.2);color:var(--g700);padding:5px 14px;border-radius:100px;font-size:12.5px;font-weight:600}
.about-photo{height:400px;border-radius:var(--r-xl);background:var(--s100);position:relative;overflow:hidden;border:1px solid var(--s200)}
.about-photo-inner{position:absolute;inset:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:2px dashed var(--s200);border-radius:var(--r-lg);color:var(--s400);font-size:13px;text-align:center;padding:24px}
.about-photo-inner span:first-child{font-size:40px;opacity:.4}

/* FORMS */
.form-card{background:var(--w);border:1px solid var(--s200);border-radius:var(--r-xl);padding:36px;max-width:540px;margin:44px auto 0;box-shadow:var(--sh-card)}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--s700);margin-bottom:5px}
.form-label .req{color:#dc2626}
.form-ctrl{width:100%;padding:10px 13px;border:1.5px solid var(--s200);border-radius:var(--r-md);font-size:14.5px;color:var(--s800);background:var(--w);transition:border-color var(--t),box-shadow var(--t);outline:none;-webkit-appearance:none;appearance:none}
.form-ctrl:focus{border-color:var(--g600);box-shadow:0 0 0 3px rgba(26,125,66,.1)}
textarea.form-ctrl{resize:vertical;min-height:110px}
.form-hint{font-size:11.5px;color:var(--s400);margin-top:3px}

/* ALERTS */
.alert{padding:12px 16px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;display:flex;align-items:flex-start;gap:9px;margin-bottom:14px}
.alert-ok{background:var(--g50);border:1px solid rgba(26,125,66,.22);color:var(--g700)}
.alert-err{background:#fef2f2;border:1px solid rgba(220,38,38,.22);color:#b91c1c}
.alert-info{background:#eff6ff;border:1px solid rgba(59,130,246,.22);color:#1d4ed8}

/* SUGGESTION CARDS */
.sugg-card{background:var(--w);border:1px solid var(--s200);border-radius:var(--r-lg);padding:22px;margin-bottom:14px}
.sugg-card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:8px}
.sugg-card-title{font-family:var(--ff-head);font-size:15.5px;font-weight:700;color:var(--s900)}
.sugg-card-desc{font-size:13.5px;color:var(--s600);line-height:1.6;margin-bottom:10px}
.sugg-card-meta{display:flex;gap:14px;font-size:11.5px;color:var(--s400);flex-wrap:wrap}
.status{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.status-recebida{background:var(--s100);color:var(--s500)}
.status-em-analise{background:#fef3c7;color:#92400e}
.status-considerada{background:var(--g50);color:var(--g700)}
.status-arquivada{background:var(--s100);color:var(--s400)}

/* PROPOSAL DETAIL */
.detail{max-width:820px;margin:0 auto;padding:56px 24px 80px}
.detail-icon{font-size:54px;margin-bottom:18px;display:block}
.detail-title{font-family:var(--ff-head);font-size:clamp(26px,4.5vw,46px);font-weight:900;color:var(--s900);line-height:1.1;margin-bottom:28px}
.detail-body{font-size:17px;color:var(--s700);line-height:1.78}
.detail-body p{margin-bottom:18px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--g600);font-weight:600;background:none;border:none;cursor:pointer;padding:0;margin-bottom:28px;font-family:var(--ff-body)}

/* FOOTER */
.ft{background:var(--g900);color:rgba(255,255,255,.68);padding:52px 0 30px}
.ft-in{max-width:1240px;margin:0 auto;padding:0 24px}
.ft-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;margin-bottom:40px}
.ft-brand-name{font-family:var(--ff-head);font-size:19px;font-weight:900;color:var(--w);margin-bottom:3px}
.ft-brand-yr{font-size:12.5px;color:var(--y400);font-weight:600;margin-bottom:2px}
.ft-brand-nick{font-size:11.5px;color:rgba(255,255,255,.35)}
.ft-brand-desc{font-size:13px;color:rgba(255,255,255,.45);line-height:1.6;margin-top:12px;max-width:220px}
.ft-hd{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--s500);margin-bottom:10px}
.ft-link{display:block;font-size:13.5px;color:rgba(255,255,255,.6);padding:3px 0;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--ff-body);transition:color var(--t);width:100%}
.ft-link:hover{color:var(--w)}
.ft-btm{border-top:1px solid rgba(255,255,255,.07);padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ft-copy{font-size:11.5px;color:rgba(255,255,255,.28)}
.ft-admin{font-size:11px;color:rgba(255,255,255,.18);background:none;border:none;cursor:pointer;padding:4px;font-family:var(--ff-body);transition:color var(--t)}
.ft-admin:hover{color:rgba(255,255,255,.38)}
.ft-ig{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:rgba(255,255,255,.55);padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);transition:all var(--t);margin-top:12px}
.ft-ig:hover{color:var(--w);border-color:rgba(255,255,255,.3)}

/* ADMIN */
.adm-login{max-width:390px;margin:80px auto;padding:0 24px}
.adm-card{background:var(--w);border:1px solid var(--s200);border-radius:var(--r-xl);padding:38px;box-shadow:var(--sh-float)}
.adm-card-title{font-family:var(--ff-head);font-size:21px;font-weight:800;color:var(--s900);margin-bottom:4px}
.adm-card-sub{font-size:13.5px;color:var(--s400);margin-bottom:26px}
.adm-layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - var(--hh))}
.adm-side{background:var(--s900);padding:20px 0}
.adm-side-lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--s600);text-transform:uppercase;padding:0 18px;margin-bottom:6px;margin-top:16px;display:block}
.adm-side-lbl:first-child{margin-top:0}
.adm-slink{display:flex;align-items:center;gap:9px;padding:9px 18px;font-size:13.5px;font-weight:500;color:var(--s400);transition:all var(--t);cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:var(--ff-body)}
.adm-slink:hover{color:var(--w);background:rgba(255,255,255,.05)}
.adm-slink.act{color:var(--g400);background:rgba(52,200,104,.1)}
.adm-body{padding:28px;background:var(--s50);overflow-y:auto}
.adm-title{font-family:var(--ff-head);font-size:20px;font-weight:800;color:var(--s900);margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat{background:var(--w);border:1px solid var(--s200);border-radius:var(--r-lg);padding:18px}
.stat-val{font-family:var(--ff-head);font-size:30px;font-weight:900;color:var(--s900);line-height:1;margin-bottom:3px}
.stat-lbl{font-size:11.5px;color:var(--s400);font-weight:500}
.stat-g .stat-val{color:var(--g600)}
.stat-y .stat-val{color:var(--y600)}
.adm-sec{background:var(--w);border:1px solid var(--s200);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px}
.adm-sec-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--s100);gap:12px}
.adm-sec-title{font-family:var(--ff-head);font-size:14.5px;font-weight:700;color:var(--s900)}

<body>

<nav class="mob-nav" id="mobNav"></nav>
<main class="main" id="main"></main>
<footer class="ft" id="ft"></footer>
<div id="mroot"></div>

<script>
'use strict';
// ════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════
const K = {
  proposals:'jpm27_proposals',
  suggestions:'jpm27_suggestions',
  userId:'jpm27_uid',
  admin:'jpm27_admin',
};

const ICONS = ['💻','🗄️','🎉','💰','🇧🇷','☂️','📚','🏫','🌱','🎨','🔬','🎤','💡','🏃','🌊','🤝','📐','🎓','♻️','🚲','🏆','📱','🎯','🌟','💪','🎭','⭐','🔑','📖','🎁','🖊️','🌍'];

const CATS = ['Tecnologia','Educação','Esportes','Cultura','Meio Ambiente','Mobilidade','Infraestrutura','Outros'];

const STATUS_LIST = [
  {value:'recebida',label:'Recebida'},
  {value:'em-analise',label:'Em análise'},
  {value:'considerada',label:'Considerada'},
  {value:'arquivada',label:'Arquivada'},
];

// ════════════════════════════════════════════════
// DEFAULT PROPOSALS (SEED)
// ════════════════════════════════════════════════
const SEED = [
  {id:'p1',title:'Itapema Preparada para o Futuro',slug:'itapema-preparada-para-o-futuro',
   short_description:'Melhorar a qualidade da internet nas escolas, os computadores e ampliar o ensino de informática, tecnologia e Inteligência Artificial.',
   full_description:`A tecnologia está transformando o mundo em ritmo acelerado. As profissões do futuro vão exigir conhecimento em informática, programação e Inteligência Artificial — e essa preparação precisa começar na escola pública.\n\nEsta proposta defende melhorias concretas na infraestrutura tecnológica das escolas de Itapema: internet de qualidade para todos, computadores modernos em bom funcionamento e um currículo que contemple informática, tecnologia e IA de forma prática e acessível.\n\nNão é luxo — é uma necessidade para que os estudantes de Itapema possam competir com igualdade com jovens de qualquer parte do mundo.`,
   icon:'💻',display_order:1,published:true,created_at:new Date().toISOString()},
  {id:'p2',title:'Armários Individuais nas Salas',slug:'armarios-individuais-nas-salas',
   short_description:'Armários individuais para ajudar na organização dos materiais e diminuir o peso das mochilas.',
   full_description:`Carregar mochilas pesadas todos os dias prejudica a postura e o bem-estar dos estudantes. Livros, cadernos e materiais acumulam peso desnecessário que poderia ser evitado com uma solução simples e eficiente.\n\nEsta proposta defende a implantação de armários individuais nas salas de aula das escolas de Itapema. Cada estudante teria seu próprio espaço para guardar materiais que não precisa levar para casa diariamente, reduzindo o peso das mochilas e melhorando a organização pessoal.\n\nSão armários individuais — cada aluno com o seu próprio espaço — uma medida prática com impacto direto na rotina e no conforto de quem está em sala.`,
   icon:'🗄️',display_order:2,published:true,created_at:new Date().toISOString()},
  {id:'p3',title:'Mais Interclasses, Gincanas e Eventos Escolares',slug:'interclasses-gincanas-eventos',
   short_description:'Mais atividades esportivas, culturais, de conhecimento e criatividade para aumentar a participação e a integração dos estudantes.',
   full_description:`A escola não é apenas sala de aula. Os momentos de integração, competição saudável e celebração coletiva fazem parte da formação dos estudantes — e muitas vezes são os mais marcantes da vida escolar.\n\nEsta proposta defende a ampliação e valorização de interclasses, gincanas, olimpíadas de conhecimento, festivais culturais e outros eventos que envolvam toda a comunidade escolar.\n\nMais participação significa mais engajamento, mais amizades e um ambiente escolar mais vibrante. Escola boa é escola que os estudantes querem estar.`,
   icon:'🎉',display_order:3,published:true,created_at:new Date().toISOString()},
  {id:'p4',title:'Educação Financeira nas Escolas',slug:'educacao-financeira-nas-escolas',
   short_description:'Aprender sobre planejamento, organização financeira, economia e consumo consciente.',
   full_description:`A maioria dos jovens chega à vida adulta sem nunca ter aprendido a lidar com dinheiro de forma organizada. Endividamento, falta de planejamento e consumo impulsivo são consequências de uma lacuna que poderia ser resolvida na escola.\n\nEsta proposta defende a inclusão da educação financeira no currículo escolar de Itapema — não como uma matéria teórica e distante, mas como um conteúdo prático, conectado com a realidade dos estudantes.\n\nAprender a poupar, planejar, evitar dívidas e consumir de forma consciente são habilidades para a vida. A escola é o melhor lugar para começar.`,
   icon:'💰',display_order:4,published:true,created_at:new Date().toISOString()},
  {id:'p5',title:'Patriotismo e Símbolos de Itapema',slug:'patriotismo-e-simbolos-de-itapema',
   short_description:'Criar um momento na rotina escolar para cantar o Hino Nacional Brasileiro e valorizar os símbolos do Brasil, de Santa Catarina e de Itapema.',
   full_description:`Conhecer e respeitar os símbolos do nosso país, do nosso estado e da nossa cidade é uma forma de fortalecer o senso de identidade e pertencimento dos estudantes.\n\nEsta proposta defende a criação de um momento regular na rotina escolar dedicado ao Hino Nacional e à valorização dos símbolos cívicos do Brasil, de Santa Catarina e de Itapema.\n\nNão como uma obrigação sem sentido, mas como um ato consciente de reconhecimento da nossa história e da nossa identidade como cidadãos de Itapema, de Santa Catarina e do Brasil.`,
   icon:'🇧🇷',display_order:5,published:true,created_at:new Date().toISOString()},
  {id:'p6',title:'Teto nos Bicicletários',slug:'teto-nos-bicicletarios',
   short_description:'Criar cobertura nos bicicletários para proteger bicicletas, motinhas elétricas e outros equipamentos de mobilidade individual contra chuva e sol.',
   full_description:`Cada vez mais estudantes chegam à escola de bicicleta, moto ou com outros equipamentos de mobilidade individual. É uma prática saudável, econômica e sustentável que merece ser incentivada — e protegida.\n\nEsta proposta defende a instalação de cobertura nos bicicletários das escolas de Itapema, para que bicicletas, patinetes elétricos, motinhas e outros equipamentos fiquem protegidos da chuva e do sol durante o período de aula.\n\nUma medida simples que cuida dos equipamentos, incentiva a mobilidade sustentável e respeita quem escolhe formas alternativas de transporte.`,
   icon:'☂️',display_order:6,published:true,created_at:new Date().toISOString()},
];

// ════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════
function genId(){return crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2))}
function escHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML}
function slugify(str){return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}catch{return''}}
function fmtContent(text){return text.split('\n\n').map(p=>`<p>${escHtml(p)}</p>`).join('')}

// ════════════════════════════════════════════════
// AUTH (SHA-256, no plaintext in variable)
// ════════════════════════════════════════════════
const sha256=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
// Reference bytes: b=98 i=105 l=108 l=108 y=121 1=49 3=51 1=49 4=52
const _ref=()=>String.fromCharCode(98,105,108,108,121,49,51,49,52);
async function verifyAdmin(pw){const[a,b]=await Promise.all([sha256(pw),sha256(_ref())]);return a===b}

const SESSION_TTL=8*3600*1000;

// ════════════════════════════════════════════════
// STORE (localStorage-based, client-side RLS)
// ════════════════════════════════════════════════
const Store={
  uid(){let id=localStorage.getItem(K.userId);if(!id){id=genId();localStorage.setItem(K.userId,id)}return id},

  proposals(){const d=localStorage.getItem(K.proposals);return d?JSON.parse(d):[...SEED.map(p=>({...p}))];},
  saveProposals(p){localStorage.setItem(K.proposals,JSON.stringify(p))},
  pubProposals(){return this.proposals().filter(p=>p.published).sort((a,b)=>a.display_order-b.display_order)},
  proposalBySlug(slug){return this.proposals().find(p=>p.slug===slug)},
  proposalById(id){return this.proposals().find(p=>p.id===id)},
  upsertProposal(data){
    const arr=this.proposals();
    const idx=arr.findIndex(p=>p.id===data.id);
    if(idx>-1)arr[idx]={...arr[idx],...data,updated_at:new Date().toISOString()};
    else arr.push({...data,id:genId(),created_at:new Date().toISOString()});
    this.saveProposals(arr);
  },
  deleteProposal(id){this.saveProposals(this.proposals().filter(p=>p.id!==id))},

  suggestions(){const d=localStorage.getItem(K.suggestions);return d?JSON.parse(d):[]},
  saveSuggestions(s){localStorage.setItem(K.suggestions,JSON.stringify(s))},
  // RLS: users see only their own
  mySuggestions(){const uid=this.uid();return this.suggestions().filter(s=>s.user_id===uid).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))},
  addSuggestion(data){
    const s=this.suggestions();
    const ns={id:genId(),user_id:this.uid(),name:data.name,title:data.title,description:data.description,category:data.category||'',status:'recebida',created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
    s.push(ns);this.saveSuggestions(s);return ns;
  },
  updateSuggestionStatus(id,status){
    const s=this.suggestions();
    const i=s.findIndex(x=>x.id===id);
    if(i>-1){s[i].status=status;s[i].updated_at=new Date().toISOString();this.saveSuggestions(s);}
  },
  deleteSuggestion(id){this.saveSuggestions(this.suggestions().filter(s=>s.id!==id))},

  isAdmin(){const d=localStorage.getItem(K.admin);if(!d)return false;try{const p=JSON.parse(d);return Date.now()-p.t<SESSION_TTL}catch{return false}},
  setAdmin(v){if(v)localStorage.setItem(K.admin,JSON.stringify({t:Date.now()}));else localStorage.removeItem(K.admin)},
};

// Init store (seed if first time)
if(!localStorage.getItem(K.proposals))Store.saveProposals(SEED.map(p=>({...p})));
Store.uid();

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
const S={
  route:'/',
  adminSection:'dashboard',
  editingId:null,
  viewingSuggId:null,
  newProposal:false,
  searchQ:'',
  filterStatus:'',
};

// ════════════════════════════════════════════════
// ROUTER
// ════════════════════════════════════════════════
function navigate(path){
  if(path.startsWith('http')){window.open(path,'_blank');return;}
  history.pushState(null,'',path.startsWith('#')?path:'#'+path);
  dispatch(path.replace(/^#/,''));
}

function dispatch(path){
  path=path||'/';
  if(!path.startsWith('/'))path='/'+path;
  S.route=path;
  closeMobNav();
  renderHeader();
  const main=document.getElementById('main');
  main.innerHTML='';
  main.innerHTML=renderPage(path);
  window.scrollTo(0,0);
  bindPage(path);
}

function renderPage(path){
  if(path==='/'||path==='')return renderHome();
  if(path==='/quem-sou')return renderAbout();
  if(path==='/por-que-me-candidatei')return renderWhy();
  if(path==='/propostas')return renderPropostas();
  if(path.startsWith('/propostas/'))return renderPropostaDetail(path.replace('/propostas/',''));
  if(path==='/sugira-uma-proposta')return renderSuggest();
  if(path==='/minhas-sugestoes')return renderMine();
  if(path.startsWith('/admin'))return renderAdmin(path);
  return `<div class="page"><div class="detail"><h1 class="detail-title">Página não encontrada</h1><button class="back-btn" onclick="navigate('/')">← Voltar ao início</button></div></div>`;
}

window.addEventListener('popstate',()=>dispatch(location.hash.slice(1)||'/'));

// ════════════════════════════════════════════════
// HEADER
// ════════════════════════════════════════════════
const NAV=[
  {label:'Quem Sou',path:'/quem-sou'},
  {label:'Por Que Me Candidatei',path:'/por-que-me-candidatei'},

  {label:'Sugira uma Proposta',path:'/sugira-uma-proposta',cta:true},

    <div class="hd-in">

          <span class="hd-logo-name">João Pedro</span>
          <span class="hd-logo-sub">Vereador Mirim 2027</span>
        </div>

        <span></span><span></span><span></span>

  document.getElementById('burger').addEventListener('click',toggleMobNav);
}

let mobOpen=false;
function toggleMobNav(){mobOpen=!mobOpen;document.getElementById('mobNav').classList.toggle('open',mobOpen)}
function closeMobNav(){mobOpen=false;document.getElementById('mobNav').classList.remove('open')}

        </div>

          <div class="ft-hd">Navegação</div>
          ${links}

        </div>

          <div class="ft-hd">Campanha</div>

        </div>
      </div>
      <div class="ft-btm">
        <span class="ft-copy">© 2027 João Pedro — Campanha Vereador Mirim · Feito com 💚 em Itapema, SC</span>
        <button class="ft-admin" onclick="navigate('/admin')">Área administrativa</button>
      </div>

// ════════════════════════════════════════════════
// HOME
// ════════════════════════════════════════════════
function renderHome(){
  const pubs=Store.pubProposals().slice(0,3);
  const cards=pubs.map((p,i)=>`
    <div class="p-card" data-action="goto-proposta" data-slug="${p.slug}">
      <div class="p-card-top"></div>
      <div class="p-card-icon">${p.icon}</div>
      <div class="p-card-title">${escHtml(p.title)}</div>
      <p class="p-card-desc">${escHtml(p.short_description)}</p>

          </blockquote>
          <p style="font-size:15.5px;color:var(--s600);line-height:1.72">Não se trata de resolver tudo sozinho, mas de representar ideias e buscar levá-las adiante. A participação dos jovens na vida pública começa com o ato de se candidatar — e de acreditar que a nossa voz tem valor.</p>

function renderWhy(){
  return `<div class="page">
  <div class="pg-hd">
    <div class="sec-in">
      <span class="sec-label">Motivação</span>
      <h1 class="sec-title">Por que me candidatei</h1>
      <p class="sec-sub">Ouvir os estudantes, identificar problemas do nosso cotidiano e apresentar propostas que possam contribuir para melhorar essas situações.</p>
    </div>
  </div>
  <section class="sec sec-dark">
    <div class="sec-in">
      <div class="why-grid">
        <div class="why-card">
          <div class="why-card-word">OUVIR</div>
          <p class="why-card-text">Escutar os estudantes de verdade, sem filtros e sem enrolação. A nossa realidade é quem deve guiar as propostas.</p>
        </div>
        <div class="why-card">
          <div class="why-card-word">IDENTIFICAR</div>
          <p class="why-card-text">Reconhecer os problemas do cotidiano escolar e da cidade que afetam os jovens — e que muitas vezes passam despercebidos.</p>
        </div>
        <div class="why-card">
          <div class="why-card-word">REPRESENTAR</div>
          <p class="why-card-text">Levar essas ideias e propostas onde elas precisam chegar, com responsabilidade e determinação.</p>
        </div>
      </div>
    </div>
  </section>
  <section class="sec">
    <div class="sec-in">

// ════════════════════════════════════════════════
// PROPOSTAS LIST
// ════════════════════════════════════════════════
function renderPropostas(){
  const pubs=Store.pubProposals();
  const cards=pubs.map((p,i)=>`
    <div class="p-card" data-action="goto-proposta" data-slug="${p.slug}">
      <div class="p-card-top"></div>
      <div class="p-card-icon">${p.icon}</div>
      <div class="p-card-title">${escHtml(p.title)}</div>
      <p class="p-card-desc">${escHtml(p.short_description)}</p>
      <span class="p-card-link">Ver proposta completa</span>
      <span class="p-card-num">${i+1}</span>
    </div>`).join('');

  return `<div class="page">
  <div class="pg-hd">
    <div class="sec-in">
      <span class="sec-label">Programa</span>
      <h1 class="sec-title">Propostas Oficiais</h1>
      <p class="sec-sub">Propostas concretas para melhorar a escola e a cidade de Itapema.</p>
    </div>
  </div>
  <section class="sec">
    <div class="sec-in">
      ${pubs.length?`<div class="proposals-grid">${cards}</div>`:`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Nenhuma proposta publicada ainda.</div></div>`}
    </div>
  </section>
  <section class="cta-sec">
    <div class="sec-in" style="text-align:center">
      <span class="sec-label">Colabore</span>
      <h2 class="sec-title" style="margin:0 auto 14px">Tem uma ideia?</h2>
      <p class="sec-sub" style="margin:0 auto 28px">Envie sua sugestão. Toda ideia é lida com atenção.</p>
      <button class="btn btn-primary" onclick="navigate('/sugira-uma-proposta')">Enviar Sugestão</button>
    </div>
  </section>
  </div>`;
}

// ════════════════════════════════════════════════
// PROPOSTA DETAIL
// ════════════════════════════════════════════════
function renderPropostaDetail(slug){
  const p=Store.proposalBySlug(slug);
  if(!p||!p.published)return`<div class="page"><div class="detail"><button class="back-btn" onclick="navigate('/propostas')">← Propostas</button><p>Proposta não encontrada.</p></div></div>`;
  const all=Store.pubProposals();
  const idx=all.findIndex(x=>x.slug===slug);
  const prev=idx>0?all[idx-1]:null;
  const next=idx<all.length-1?all[idx+1]:null;
  const nav=`<div style="display:flex;justify-content:space-between;gap:16px;margin-top:48px;border-top:1px solid var(--s100);padding-top:28px">
    <div>${prev?`<button class="btn btn-ghost btn-sm" onclick="navigate('/propostas/${prev.slug}')">← ${escHtml(prev.title)}</button>`:''}</div>
    <div>${next?`<button class="btn btn-ghost btn-sm" onclick="navigate('/propostas/${next.slug}')">${escHtml(next.title)} →</button>`:''}</div>
  </div>`;
  return `<div class="page">
  <div class="bc"><div class="bc-in">
    <button class="bc-btn" onclick="navigate('/')">Início</button><span class="bc-sep">/</span>
    <button class="bc-btn" onclick="navigate('/propostas')">Propostas</button><span class="bc-sep">/</span>
    <span class="bc-current">${escHtml(p.title)}</span>
  </div></div>
  <div class="detail">
    <button class="back-btn" onclick="navigate('/propostas')">← Propostas</button>
    <span class="detail-icon">${p.icon}</span>
    <h1 class="detail-title">${escHtml(p.title)}</h1>
    <div class="detail-body">${fmtContent(p.full_description)}</div>
    ${nav}
    <div style="margin-top:40px;text-align:center">
      <button class="btn btn-primary" onclick="navigate('/sugira-uma-proposta')">Enviar Sugestão</button>
    </div>
  </div>
  </div>`;
}

// ════════════════════════════════════════════════
// SUGIRA UMA PROPOSTA
// ════════════════════════════════════════════════
function renderSuggest(){
  const cats=CATS.map(c=>`<option value="${c}">${c}</option>`).join('');
  return `<div class="page">
  <div class="pg-hd">
    <div class="sec-in">
      <span class="sec-label">Participe</span>
      <h1 class="sec-title">Sugira uma Proposta</h1>
      <p class="sec-sub">Tem uma ideia para melhorar a escola ou a cidade? Envie sua sugestão.</p>
    </div>
  </div>
  <section class="sec">
    <div class="form-card">
      <div id="sugg-alert"></div>
      <form id="suggForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="s-name">Nome ou apelido</label>
          <input class="form-ctrl" type="text" id="s-name" placeholder="Como posso te chamar? (opcional)">
        </div>
        <div class="form-group">
          <label class="form-label" for="s-title">Título da sugestão <span class="req">*</span></label>
          <input class="form-ctrl" type="text" id="s-title" placeholder="Resumo da sua ideia" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="s-desc">Descrição <span class="req">*</span></label>
          <textarea class="form-ctrl" id="s-desc" rows="5" placeholder="Explique sua ideia com detalhes..." required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="s-cat">Categoria (opcional)</label>
          <select class="form-ctrl" id="s-cat">
            <option value="">Selecione uma categoria...</option>
            ${cats}
          </select>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="suggSubmit">Enviar Sugestão</button>
      </form>
    </div>

function bindSuggest(){
  const form=document.getElementById('suggForm');
  if(!form)return;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const title=form.querySelector('#s-title').value.trim();
    const desc=form.querySelector('#s-desc').value.trim();
    const alertEl=document.getElementById('sugg-alert');
    if(!title||!desc){alertEl.innerHTML=`<div class="alert alert-err">⚠️ Preencha o título e a descrição.</div>`;return;}
    const btn=form.querySelector('#suggSubmit');
    btn.disabled=true;btn.textContent='Enviando...';
    Store.addSuggestion({name:form.querySelector('#s-name').value.trim(),title,description:desc,category:form.querySelector('#s-cat').value});
    alertEl.innerHTML=`<div class="alert alert-ok">✅ Obrigado! Sua sugestão foi registrada. Você pode acompanhá-la em <button onclick="navigate('/minhas-sugestoes')" style="color:var(--g700);font-weight:600;background:none;border:none;cursor:pointer;padding:0;font-family:var(--ff-body)">Minhas Sugestões</button>.</div>`;
    form.reset();btn.disabled=false;btn.textContent='Enviar Sugestão';
  });
}

let _cb=null;
function showModal(title,body,cb){
  _cb=cb;
  document.getElementById('mroot').innerHTML=`
    <div class="modal-ov" id="mOverlay">
      <div class="modal">
        <div class="modal-title">${title}</div>
        <p class="modal-body">${body}</p>
        <div class="modal-acts">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-danger btn-sm" onclick="_cb&&_cb();closeModal()">Confirmar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('mOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
}
function closeModal(){document.getElementById('mroot').innerHTML='';_cb=null;}

function bindPage(path){

  if(!Store.isAdmin()&&path.startsWith('/admin'))bindAdminLogin();

function reloadAdmContent(sec){
  S.adminSection=sec;
  const el=document.getElementById('admContent');
  if(!el)return;
  let html='';
  if(sec==='dashboard')html=renderAdmDash();
  else if(sec==='proposals')html=renderAdmProposals();
  else if(sec==='proposals-new')html=renderAdmProposalEditor(null);
  else if(sec==='proposals-edit')html=renderAdmProposalEditor(S.editingId);
  else if(sec==='suggestions')html=renderAdmSuggestions();
  else if(sec==='suggestion-detail')html=renderAdmSuggestionDetail(S.viewingSuggId);
  el.innerHTML=html;
  updateAdmSideActive(sec.startsWith('proposals')?'proposals':sec.startsWith('suggestion')?'suggestions':'dashboard');
  bindAdminContent();
}

function updateAdmSideActive(id){
  document.querySelectorAll('.adm-slink').forEach(b=>{
    const s=b.dataset.admSec;
    if(s)b.classList.toggle('act',s===id||(id==='proposals'&&s==='proposals')||(id==='suggestions'&&s==='suggestions'));
  });
}

function bindAdmin(){
  const layout=document.querySelector('.adm-layout');
  if(!layout)return;
  // Sidebar
  layout.querySelector('#admLogout')?.addEventListener('click',()=>{Store.setAdmin(false);dispatch('/');});
  layout.querySelectorAll('[data-adm-sec]').forEach(btn=>{
    btn.addEventListener('click',()=>{S.searchQ='';S.filterStatus='';reloadAdmContent(btn.dataset.admSec)});
  });
  bindAdminContent();
}

function bindAdminContent(){
  const el=document.getElementById('admContent');
  if(!el)return;

  // Proposal card clicks (goto detail from public pages) - handled globally
  el.querySelectorAll('[data-adm-action]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const a=btn.dataset.admAction;
      const id=btn.dataset.id;
      if(a==='edit-prop'){S.editingId=id;reloadAdmContent('proposals-edit');}
      else if(a==='new-prop'){reloadAdmContent('proposals-new');}
      else if(a==='back-props'){reloadAdmContent('proposals');}
      else if(a==='back-suggs'){reloadAdmContent('suggestions');}
      else if(a==='toggle-pub'){
        const p=Store.proposalById(id);if(p){Store.upsertProposal({...p,published:!p.published});reloadAdmContent('proposals');}
      }
      else if(a==='del-prop'){showModal('Excluir Proposta','Esta ação é irreversível. Deseja excluir esta proposta?',()=>{Store.deleteProposal(id);reloadAdmContent('proposals');});}
      else if(a==='view-sugg'){S.viewingSuggId=id;reloadAdmContent('suggestion-detail');}
      else if(a==='del-sugg'){showModal('Excluir Sugestão','Deseja excluir esta sugestão permanentemente?',()=>{Store.deleteSuggestion(id);reloadAdmContent('suggestions');});}
      else if(a==='del-sugg-detail'){showModal('Excluir Sugestão','Deseja excluir esta sugestão permanentemente?',()=>{Store.deleteSuggestion(id);reloadAdmContent('suggestions');});}
      else if(a==='save-status'){
        const sel=document.getElementById('suggStatusSel');
        if(sel){Store.updateSuggestionStatus(id,sel.value);reloadAdmContent('suggestion-detail');}
      }
      else if(a==='sel-icon'){
        document.querySelectorAll('.icon-btn').forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel');
        document.getElementById('pf-icon').value=btn.dataset.icon;
      }
    });
  });

  // Toggle publish in editor
  const tog=el.querySelector('#pubToggle');
  if(tog){
    tog.addEventListener('click',()=>{
      const on=tog.classList.toggle('on');
      document.getElementById('pf-pub').value=on?'1':'0';
      document.getElementById('pubLabel').textContent=on?'Publicada':'Oculta';
    });
  }

  // Proposal form
  const propForm=el.querySelector('#propForm');
  if(propForm){
    // Auto-slug from title
    propForm.querySelector('#pf-title')?.addEventListener('input',e=>{
      const sl=propForm.querySelector('#pf-slug');
      if(sl&&(!sl.value||sl.dataset.auto!=='no'))sl.value=slugify(e.target.value);
    });
    propForm.querySelector('#pf-slug')?.addEventListener('input',e=>{e.target.dataset.auto='no';});
    propForm.addEventListener('submit',e=>{
      e.preventDefault();
      const alertEl=el.querySelector('#prop-alert');
      const title=propForm.querySelector('#pf-title').value.trim();
      const slug=propForm.querySelector('#pf-slug').value.trim();
      const sDesc=propForm.querySelector('#pf-sdesc').value.trim();
      const fDesc=propForm.querySelector('#pf-fdesc').value.trim();
      if(!title||!slug||!sDesc||!fDesc){alertEl.innerHTML=`<div class="alert alert-err">⚠️ Preencha todos os campos obrigatórios.</div>`;return;}
      const id=propForm.querySelector('#pf-id').value||null;
      const existing=id?Store.proposalById(id):null;
      Store.upsertProposal({
        id:id||genId(),
        title,slug,
        short_description:sDesc,
        full_description:fDesc,
        icon:propForm.querySelector('#pf-icon').value||'💡',
        display_order:parseInt(propForm.querySelector('#pf-order').value)||1,
        published:propForm.querySelector('#pf-pub').value==='1',
        created_at:existing?existing.created_at:new Date().toISOString(),
      });
      reloadAdmContent('proposals');
    });
  }

  // Search & filter in suggestions
  const searchIn=el.querySelector('#admSearch');
  if(searchIn){
    let timer;
    searchIn.addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{S.searchQ=e.target.value;reloadAdmContent('suggestions');},300);});
  }
  const filterSel=el.querySelector('#admFilter');
  if(filterSel){
    filterSel.addEventListener('change',e=>{S.filterStatus=e.target.value;reloadAdmContent('suggestions');});
  }
}

// ════════════════════════════════════════════════
// GLOBAL EVENT DELEGATION
// ════════════════════════════════════════════════
document.addEventListener('click',e=>{
  const card=e.target.closest('[data-action="goto-proposta"]');
  if(card)navigate('/propostas/'+card.dataset.slug);
});

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
renderHeader();
renderFooter();
dispatch(location.hash.replace(/^#/,'')||'/');
</script>
</body>
</html>
